name: Build Gym Tracker Test APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and capture diagnostics
        shell: bash
        run: |
          mkdir -p builds
          : > builds/build.log
          echo "Gym Tracker Android STABLE TEST build" >> builds/build.log
          echo "Package: fr.aris.gymtrack.test" >> builds/build.log
          echo "Signing: dedicated stable test key" >> builds/build.log
          echo "Commit: $GITHUB_SHA" >> builds/build.log
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> builds/build.log
          echo >> builds/build.log

          result=success

          run_step() {
            label="$1"
            shift
            echo "===== $label =====" >> builds/build.log
            "$@" >> builds/build.log 2>&1
            code=$?
            echo "Exit code: $code" >> builds/build.log
            echo >> builds/build.log
            if [ "$code" -ne 0 ]; then
              result=failure
              return "$code"
            fi
            return 0
          }

          run_step "npm ci" npm ci || true
          if [ "$result" = success ]; then
            echo "===== patch syntax =====" >> builds/build.log
            node --check active-workout-patch.js >> builds/build.log 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              node --check data/active-workout-stack-fix.js >> builds/build.log 2>&1
              code=$?
            fi
            echo "Exit code: $code" >> builds/build.log
            echo >> builds/build.log
            if [ "$code" -ne 0 ]; then result=failure; fi
          fi
          if [ "$result" = success ]; then run_step "tests" npm test || true; fi
          if [ "$result" = success ]; then run_step "sync android" npm run sync:android || true; fi
          if [ "$result" = success ]; then
            echo "===== gradle assembleDebug =====" >> builds/build.log
            (cd android && ./gradlew assembleDebug) >> builds/build.log 2>&1
            code=$?
            echo "Exit code: $code" >> builds/build.log
            echo >> builds/build.log
            if [ "$code" -ne 0 ]; then result=failure; fi
          fi

          rm -f builds/gym-tracker-debug.apk builds/gym-tracker-test-debug.apk
          if [ "$result" = success ] && [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk builds/gym-tracker-test-stable-debug.apk
            echo "RESULT=success" >> builds/build.log
          else
            rm -f builds/gym-tracker-test-stable-debug.apk
            echo "RESULT=failure" >> builds/build.log
          fi

          echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> builds/build.log

      - name: Publish build result to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- builds
          if ! git diff --cached --quiet; then
            git commit -m "build: publish stable Android test debug result [skip ci]"
            git push origin HEAD:main
          fi

# Stable test-signing build trigger + first-frame stack fix validation.
